
name: Build PhotoText Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PhotoTextStudio_Advanced_Source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Extract project ZIP
        run: |
          unzip -q PhotoTextStudio_Advanced_Source.zip -d source
          test -f source/PhotoTextStudio/settings.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: source/PhotoTextStudio
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoTextStudio-debug-apk
          path: source/PhotoTextStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

